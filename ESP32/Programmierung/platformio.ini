; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; ohne Auswahl wird nur das Gesamtprogramm gebaut/hochgeladen
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Testdateien in src/tests/ nicht ins Gesamtprogramm einbauen
build_src_filter = +<*> -<tests/>
lib_deps =
    fastled/FastLED @ 3.6.0
    https://github.com/AaronLiddiment/LEDMatrix.git#1ba98bc4316a1fc0a1e87fec57fea3e60fbd325a
    https://github.com/AaronLiddiment/LEDText.git#e964b68c4b4685cb45d0b9bd56add4f0d512247a

; ---------------------------------------------------------------
; TEST: FreeRTOS Aufgabe 2 - MasterTask (src/tests/Test_MasterTask.cpp)
; In VS Code unten in der Leiste die Umgebung "env:test_master" waehlen
; ---------------------------------------------------------------
[env:test_master]
extends = env:esp32dev
; der Test braucht kein LED-Panel -> FastLED & Co. nicht mitbauen
lib_deps =
build_src_filter =
    +<tests/Test_MasterTask.cpp>
    +<FreeRtosAufgaben.cpp>
    +<EntprellterTaster_SPL.cpp>
